# Supabase Cloud PostgreSQL - Session Pooler (IPv4 compatible)
# Shared by the whole team - all data persists in the cloud

spring.application.name=Bookstore Backend - Supabase

# Server
server.port=8080

# PostgreSQL / Supabase Session Pooler Connection
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.ieijtdvntyqookxrcnjy
spring.datasource.password=Fool@123#123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate - auto creates all tables on first run
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable H2 console
spring.h2.console.enabled=false

# JWT
jwt.secret=bookstore-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# Logging
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
