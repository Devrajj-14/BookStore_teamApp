# Application Configuration
spring.application.name=Bookstore Backend

# Active Profile (choose one: dev, mysql, prod)
# dev   = H2 database (in-memory, no setup needed)
# mysql = MySQL database (requires local MySQL installation)
# prod  = PostgreSQL (for cloud deployment)
spring.profiles.active=prod

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=bookstore-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Note: Database configuration is in profile-specific files:
# - application-dev.properties (H2)
# - application-mysql.properties (MySQL)
# - application-prod.properties (PostgreSQL)
