# Production Profile - PostgreSQL (Supabase/Cloud)
# Use this for deployment

# PostgreSQL Database Configuration (update with your credentials)
spring.datasource.url=jdbc:postgresql://your-db-host:5432/bookstore
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 Console
spring.h2.console.enabled=false

# Production Logging
logging.level.com.bookstore=INFO
logging.level.org.springframework.security=WARN
